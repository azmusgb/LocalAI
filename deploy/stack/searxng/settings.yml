use_default_settings: true

search:
  formats:
    - html
    - json

server:
  bind_address: "0.0.0.0"
  port: 8080

# Bing alongside the defaults: when Google and Brave rate-limited us (Oct 2026) and DuckDuckGo timed out, it still
# answered. Health shows research as degraded, naming the engines that did not answer, when searches find nothing.
engines:
  - name: bing
    disabled: false
