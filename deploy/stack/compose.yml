# Every container Local AI runs on the Windows host, in one place. This reproduces the stack that was built by
# hand and from three compose files in C:\LocalAI\n8n (same names, ports, mounts, networks and settings), so a new
# or rebuilt host can be provisioned with deploy\stack\Install-LocalAI-Stack.ps1.
#
# Secrets and host-specific values come from C:\LocalAI\stack\stack.env (never in the repo; see stack.env.example):
#   docker compose --env-file C:\LocalAI\stack\stack.env -f deploy\stack\compose.yml up -d
# On the current host everything already runs; deploy\stack\Test-LocalAI-Stack.ps1 checks it still matches this file.
name: local-ai

x-host-gateway: &host-gateway
  extra_hosts:
    - "host.docker.internal:host-gateway"

# Every container's log is capped at 3 × 10 MB (Docker Desktop keeps json-file logs with no limit otherwise).
x-logging: &logging
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  appliance:
    # node:22-alpine, pinned to the image that has been running; bump it in a PR.
    image: node@sha256:0a7108bf6c7bf5de370ffb1a3ed6be93d405b43ff159f681a8d18c0e2bc2e402
    container_name: local-ai-appliance
    restart: unless-stopped
    command: ["node", "/app/server.js"]
    <<: [*host-gateway, *logging]
    # About 60 MB idle; the headroom is for the npm/node commands and staged self-changes it runs.
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    ports:
      - "3080:3080"
      # Host-only tools (PowerShell Workbench); published on the host's loopback only.
      - "127.0.0.1:3090:3090"
    environment:
      PORT: "3080"
      LOCAL_UI_PORT: "3090"
      # node:sqlite prints an ExperimentalWarning on every start; it isn't an error, and scripts read stderr as one.
      NODE_OPTIONS: --disable-warning=ExperimentalWarning
      DATA_DIR: /data
      WORKSPACE_ROOT: /workspace
      MODEL: qwen3:4b-instruct-32k
      OLLAMA_URL: http://host.docker.internal:11434
      COMFY_URL: http://host.docker.internal:8188
      N8N_URL: http://local-ai-n8n:5678
      PROXY_URL: http://local-ai-ollama-responses-proxy:8080
      SEARXNG_URL: http://local-ai-searxng:8080
      REPORT_PATH: /reports/LocalAI-Certification-latest.txt
      CAPABILITY_CACHE_MS: "30000"
      CHAT_MODEL_TIMEOUT_MS: "180000"
      ENGINEERING_MODEL_TIMEOUT_MS: "600000"
      MAC_AI_HOME_URL: ${MAC_AI_HOME_URL:-}
      MAC_DSH_URL: ${MAC_DSH_URL:-}
      # Shown as a phone QR code in Health › Secure connection when set.
      LOCALAI_REMOTE_NAME: ${LOCALAI_REMOTE_NAME:-}
      # With LOCALAI_REMOTE_NAME, the addresses a phone is offered when the one it uses can't be reached (/healthz).
      LOCALAI_HOST_IP: ${LOCALAI_HOST_IP:-}
      # Services › Workshop display: the touchscreen beside the printer (docs/WORKSHOP-DISPLAY.md). Empty means the
      # default, http://10.0.0.124; only an http(s) address on the home network or a .local name is used.
      LOCALAI_WORKSHOP_URL: ${LOCALAI_WORKSHOP_URL:-}
      # The display's read-only printer-status token (Local Portal › More › Read-only status access). Empty means no
      # printer line. A secret: it lives only in stack.env.
      LOCALAI_WORKSHOP_STATUS_TOKEN: ${LOCALAI_WORKSHOP_STATUS_TOKEN:-}
      # The display's sign-in code token (Local Portal › More › Sign-in code access, wsc_…). Empty means no Show sign-in
      # code button. A secret: it lives only in stack.env.
      LOCALAI_WORKSHOP_CODE_TOKEN: ${LOCALAI_WORKSHOP_CODE_TOKEN:-}
      POWERSHELL_UI_TOKEN: ${POWERSHELL_UI_TOKEN:?set in stack.env}
      POWERSHELL_BRIDGE_TOKEN: ${POWERSHELL_BRIDGE_TOKEN:?set in stack.env}
    volumes:
      # The deploy (deploy\Deploy-LocalAI.ps1) replaces this folder; the container only reads it.
      - ${LOCALAI_ROOT:-C:/LocalAI}/appliance/app:/app:ro
      - appliance-data:/data
      - ${LOCALAI_ROOT:-C:/LocalAI}/reports:/reports:ro
      - C:/Projects:/workspace/projects
      - C:/repos:/workspace/repos
    networks: [local-ai]

  https:
    # caddy:2.10-alpine, pinned to the image that has been running.
    image: caddy@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    container_name: local-ai-https
    restart: unless-stopped
    <<: *logging
    # About 20 MB in use.
    mem_limit: 256m
    healthcheck:
      # Caddy's admin API answers inside the container only (localhost:2019).
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    ports: ["80:80", "443:443"]
    environment:
      LOCALAI_NAME: ${LOCALAI_NAME:-localai.home.arpa}
      LOCALAI_HOST_IP: ${LOCALAI_HOST_IP:?set in stack.env}
      # Tailscale name for access away from home; never empty (see deploy/caddy/Caddyfile).
      LOCALAI_REMOTE_NAME: ${LOCALAI_REMOTE_NAME:-localai.remote.invalid}
    volumes:
      - caddy-data:/data
      - ${LOCALAI_ROOT:-C:/LocalAI}/repo/deploy/caddy:/etc/caddy:ro
    networks: [local-ai]

  n8n:
    # n8n 2.40.7, pinned to the image that has been running.
    image: docker.n8n.io/n8nio/n8n@sha256:ffeb52485f78b1b06c9a832205853cf75da72a07a514c9a27724df85979d6c34
    container_name: local-ai-n8n
    restart: unless-stopped
    <<: *logging
    # About 0.5 GB in use; the cap keeps a runaway workflow from taking the memory the appliance needs.
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5678/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    ports: ["127.0.0.1:5678:5678"]
    environment:
      N8N_EDITOR_BASE_URL: http://${LOCALAI_HOST_IP}:5678/
      WEBHOOK_URL: http://${LOCALAI_HOST_IP}:5678/
      # Encrypts the credentials stored in n8n: losing it makes them unreadable.
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set in stack.env}
      GENERIC_TIMEZONE: ${TZ:-America/New_York}
      TZ: ${TZ:-America/New_York}
      N8N_SECURE_COOKIE: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_RUNNERS_ENABLED: "true"
    volumes: [n8n-data:/home/node/.n8n]
    # n8n is the sandbox's only client, so it alone joins the sandbox network.
    networks: [local-ai, sandbox]

  ollama-responses-proxy:
    image: node@sha256:0a7108bf6c7bf5de370ffb1a3ed6be93d405b43ff159f681a8d18c0e2bc2e402
    container_name: local-ai-ollama-responses-proxy
    restart: unless-stopped
    command: ["node", "/app/server.js"]
    <<: [*host-gateway, *logging]
    # About 40 MB in use.
    mem_limit: 256m
    environment:
      LISTEN_HOST: 0.0.0.0
      LISTEN_PORT: "8080"
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      CACHE_FILE: /data/cache.json
      CACHE_MAX_RESPONSES: "250"
      LOG_LEVEL: info
    volumes:
      - ${LOCALAI_ROOT:-C:/LocalAI}/repo/deploy/stack/ollama-responses-proxy/server.js:/app/server.js:ro
      - proxy-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      local-ai:
        aliases: [ollama-responses-proxy]

  searxng:
    image: ghcr.io/searxng/searxng@sha256:5286edb35782454ab8a102c5eff6b54bff745853191b46aeead95f225aa6dfb6
    container_name: local-ai-searxng
    restart: unless-stopped
    <<: *logging
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?set in stack.env}
    volumes:
      - ${LOCALAI_ROOT:-C:/LocalAI}/repo/deploy/stack/searxng/settings.yml:/etc/searxng/settings.yml:ro
    networks:
      local-ai:
        aliases: [searxng]

  # n8n's code sandbox: a one-shot job makes the mutual-TLS certificates, then an API and one Docker-in-Docker runner.
  # They live on their own network with n8n, away from the appliance, Caddy and search: the runner is privileged.
  sandbox-certs:
    image: n8nio/n8n-sandbox-service-api:${N8N_SANDBOX_VERSION:-1.5.0}
    container_name: local-ai-sandbox-certs
    <<: *logging
    user: "0:0"
    entrypoint: ["sh", "-c"]
    command:
      - >
        bootstrap-mtls.sh --out-dir /tls --api-san sandbox-api
        --control-san-prefix sandbox-runner --world-readable &&
        chown -R sandbox-api:sandbox-api /tls/api &&
        chmod -R a+rX /tls
    environment:
      NUM_RUNNERS: "1"
    volumes: [sandbox-tls:/tls]
    networks: [sandbox]

  sandbox-api:
    image: n8nio/n8n-sandbox-service-api:${N8N_SANDBOX_VERSION:-1.5.0}
    container_name: local-ai-sandbox-api
    restart: unless-stopped
    <<: *logging
    depends_on:
      sandbox-certs:
        condition: service_completed_successfully
    environment:
      SANDBOX_API_KEYS: ${SANDBOX_API_KEYS:?set in stack.env}
      SANDBOX_API_RUNNER_REGISTRATION_TOKEN: ${SANDBOX_API_RUNNER_REGISTRATION_TOKEN:?set in stack.env}
      SANDBOX_API_RUNNER_API_KEY: ${SANDBOX_API_RUNNER_API_KEY:?set in stack.env}
      SANDBOX_API_GRPC_TLS_CERT_FILE: /tls/api/grpc-server.crt
      SANDBOX_API_GRPC_TLS_KEY_FILE: /tls/api/grpc-server.key
      SANDBOX_API_GRPC_TLS_CLIENT_CA_FILE: /tls/api/ca.crt
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_CA_FILE: /tls/api/ca.crt
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_CERT_FILE: /tls/api/control-grpc-api-client.crt
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_KEY_FILE: /tls/api/control-grpc-api-client.key
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_SERVER_NAME: sandbox-runner-1
    volumes: [sandbox-tls:/tls:ro]
    # About 10 MB in use.
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      sandbox:
        aliases: [sandbox-api]

  sandbox-runner-1:
    image: n8nio/n8n-sandbox-service-runner-dind:${N8N_SANDBOX_VERSION:-1.5.0}
    container_name: local-ai-sandbox-runner-1
    privileged: true
    restart: unless-stopped
    <<: *logging
    # Docker-in-Docker for n8n's code sandboxes (each capped at 512 MB below); the runner as a whole gets 2 GB.
    mem_limit: 2g
    depends_on:
      sandbox-api:
        condition: service_healthy
    environment:
      SANDBOX_RUNNER_API_KEYS: ${SANDBOX_API_RUNNER_API_KEY:?set in stack.env}
      SANDBOX_RUNNER_REGISTRATION_TOKEN: ${SANDBOX_API_RUNNER_REGISTRATION_TOKEN:?set in stack.env}
      SANDBOX_RUNNER_API_GRPC_ADDR: sandbox-api:9090
      SANDBOX_RUNNER_HTTP_BASE_URL: https://sandbox-runner-1:8080
      SANDBOX_RUNNER_CONTROL_GRPC_LISTEN_ADDR: ":9091"
      SANDBOX_RUNNER_CONTROL_GRPC_ADVERTISE_ADDR: sandbox-runner-1:9091
      SANDBOX_RUNNER_ID: runner-1
      SANDBOX_RUNNER_DOCKER_SANDBOX_IMAGE: n8nio/n8n-sandbox-service-sandbox:${N8N_SANDBOX_VERSION:-1.5.0}
      SANDBOX_RUNNER_REGISTRATION_GRPC_CA_FILE: /tls/runner/ca.crt
      SANDBOX_RUNNER_REGISTRATION_GRPC_CERT_FILE: /tls/runner/grpc-client.crt
      SANDBOX_RUNNER_REGISTRATION_GRPC_KEY_FILE: /tls/runner/grpc-client.key
      SANDBOX_RUNNER_REGISTRATION_GRPC_SERVER_NAME: sandbox-api
      SANDBOX_RUNNER_CONTROL_GRPC_TLS_CERT_FILE: /tls/runner/control-grpc-server.crt
      SANDBOX_RUNNER_CONTROL_GRPC_TLS_KEY_FILE: /tls/runner/control-grpc-server.key
      SANDBOX_RUNNER_CONTROL_GRPC_TLS_CLIENT_CA_FILE: /tls/runner/ca.crt
      SANDBOX_RUNNER_DEFAULT_MEMORY_MB: "512"
      SANDBOX_RUNNER_DEFAULT_CPU_PERCENT: "100"
      SANDBOX_RUNNER_DEFAULT_PIDS_MAX: "256"
    volumes: [sandbox-tls:/tls:ro]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "--no-check-certificate", "https://localhost:8080/readyz"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s
    networks:
      sandbox:
        aliases: [sandbox-runner-1]

# Names match the existing volumes and network, so data carries over. They are external: they predate this file, hold
# the data, and compose never creates, renames or removes them (a `down` can't take them with it). On a new host
# deploy\stack\Install-LocalAI-Stack.ps1 creates them first.
volumes:
  appliance-data: { name: local-ai-appliance-data, external: true }
  caddy-data: { name: localai-caddy-data, external: true }
  n8n-data: { name: n8n_data, external: true }
  proxy-data: { name: local-ai-ollama-responses-proxy-data, external: true }
  sandbox-tls: { name: local-ai-sandbox-tls, external: true }

networks:
  # The name is historical: this is the network every Local AI container shares.
  local-ai:
    name: local-ai-sandbox-net
    external: true
  # n8n and its code sandbox only. Not internal: the runner pulls the sandbox image.
  sandbox:
    name: local-ai-n8n-sandbox
    external: true
