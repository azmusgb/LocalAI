name: validate
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check app/server.js
          node --check app/public/app.js
          find app/public -maxdepth 1 -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Required files
        run: |
          test -f app/server.js
          test -f app/public/app.js
          test -f app/public/index.html
          test -f app/public/manifest.json
          test -f app/public/sw.js
      - name: Prevent private-key files
        run: |
          ! find app -type f \( -name '*.pem' -o -name '*.key' -o -name '*.pfx' -o -name '*.p12' -o -name '.env' \) | grep .
      - name: Agent Operations browser acceptance
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          mkdir -p /tmp/localai-data
          DATA_DIR=/tmp/localai-data PORT=3080 node app/server.js >/tmp/localai-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..20}; do curl -fsS http://127.0.0.1:3080/healthz >/dev/null && break; sleep 1; done
          node tests/agent-operations-ui.mjs