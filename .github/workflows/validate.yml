name: validate
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate deployment candidate
        run: npm run validate
      - name: Offline mission regression tests
        run: npm test
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Agent Operations browser acceptance
        run: |
          mkdir -p /tmp/localai-data
          DATA_DIR=/tmp/localai-data PORT=3080 node app/server.js >/tmp/localai-server.log 2>&1 &
          SERVER_PID=$!
          cleanup() {
            result=$?
            if [ "$result" -ne 0 ]; then cat /tmp/localai-server.log; fi
            kill "$SERVER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          ready=false
          for i in {1..20}; do
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo 'LocalAI exited before becoming ready' >&2
              exit 1
            fi
            if curl --max-time 2 -fsS http://127.0.0.1:3080/healthz >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            echo 'LocalAI did not become healthy before the readiness deadline' >&2
            exit 1
          fi
          npm run test:browser
      - name: Preserve server diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: localai-server-log
          path: /tmp/localai-server.log
          if-no-files-found: ignore
