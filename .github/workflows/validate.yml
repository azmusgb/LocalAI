name: validate

# PRs only: the auto-deploy agent certifies main itself before promoting it, so re-running everything after a
# merge only duplicated the PR's run. Docs-only changes skip CI. A newer push cancels the PR's older run.
on:
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**']
  workflow_dispatch:

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      # Every app and test script, so a new file can't be left out.
      - name: JavaScript syntax
        run: for f in app/*.js app/public/*.js tests/*.mjs tests/*.cjs; do node --check "$f" || exit 1; done

      # Every tests/*.test.cjs file, so new suites can't be silently left out of CI.
      - name: Unit and contract tests
        run: npm test

      - name: Python syntax
        run: python3 -m py_compile host/gridcraft-bridge.py host/gridcraft-agent/gridcraft_ai.py

      - name: PowerShell syntax
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Path deploy,tests,host -Filter '*.ps1' -File -Recurse | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Host "::error file=$($_.FullName)::PowerShell parse failure"
              $errors | ForEach-Object { Write-Host $_.Message }
            }
          }
          if ($failed) { exit 1 }

      - name: Prevent private-key files
        run: |
          ! find app -type f \( -name '*.pem' -o -name '*.key' -o -name '*.pfx' -o -name '*.p12' -o -name '.env' \) | grep .

      - name: Validate deployment candidate
        run: pwsh -NoProfile -File deploy/Test-LocalAI-Candidate.ps1 -CandidateRoot . -LocalNode

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser acceptance
        run: |
          mkdir -p /tmp/localai-data
          LOCALAI_WORKSHOP_URL="${LOCALAI_WORKSHOP_URL:-http://127.0.0.1:9}" LOCALAI_PI_HUB_URL="${LOCALAI_PI_HUB_URL:-off}" DATA_DIR=/tmp/localai-data PORT=3080 node app/server.js >/tmp/localai-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          ready=0
          for i in {1..30}; do
            if curl --max-time 2 -fsS http://127.0.0.1:3080/healthz >/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            echo '::error::Local AI server did not become ready for browser acceptance tests.'
            echo '--- server log ---'
            cat /tmp/localai-server.log || true
            exit 1
          fi

          npm run test:browser

      - name: Preserve server diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: localai-server-log
          path: /tmp/localai-server.log
          if-no-files-found: ignore
