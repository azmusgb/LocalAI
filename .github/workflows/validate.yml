name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: JavaScript syntax
        run: |
          node --check app/server.js
          node --check app/model-runtime.js
          node --check app/run-ledger.js
          node --check app/storage.js
          node --check app/release.js
          node --check app/storage-cli.js
          node --check app/agent-orchestrator.js
          find app/public -maxdepth 1 -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check tests/agent-operations-ui.mjs
          node --check tests/integration-hub-ui.mjs
          node --check tests/navigation-ui.mjs
          node --check tests/mobile-ui.mjs
          node --check tests/first-run-ui.mjs
          node --check tests/models-ui.mjs
          node --check tests/images-ui.mjs
          node --check tests/claude-chat-ui.mjs
          node --check tests/agent-orchestrator.test.cjs
          node --check tests/model-runtime.test.cjs
          node --check tests/model-runtime-ui.test.cjs
          node --check tests/model-runtime-server-contract.test.cjs
          node --check tests/run-ledger.test.cjs
          node --check tests/run-execution-server-contract.test.cjs
          node --check tests/run-execution-ui.test.cjs
          node --check tests/run-api.test.cjs
          node --check tests/security-contract.test.cjs

      # Every tests/*.test.cjs file, so new suites can't be silently left out of CI.
      - name: Unit and contract tests
        run: npm test

      - name: Python syntax
        run: python3 -m py_compile host/gridcraft-bridge.py host/gridcraft-agent/gridcraft_ai.py

      - name: PowerShell syntax
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Path deploy,tests,host -Filter '*.ps1' -File -Recurse | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Host "::error file=$($_.FullName)::PowerShell parse failure"
              $errors | ForEach-Object { Write-Host $_.Message }
            }
          }
          if ($failed) { exit 1 }

      - name: Required files
        run: |
          test -f package.json
          test -f package-lock.json
          test -f app/server.js
          test -f app/model-runtime.js
          test -f app/run-ledger.js
          test -f app/storage.js
          test -f app/release.js
          test -f deploy/Deployment-LocalAI.ps1
          test -f app/storage-cli.js
          test -f deploy/Storage-LocalAI.ps1
          test -f app/public/app.js
          test -f app/public/index.html
          test -f app/public/manifest.json
          test -f app/public/sw.js
          test -f app/public/ui.js
          test -f app/public/app.css
          test -f deploy/Deploy-LocalAI.ps1
          test -f deploy/Get-LocalAI-DeployStatus.ps1
          test -f deploy/Install-LocalAI-DeployAgent.ps1
          test -f deploy/Rollback-LocalAI.ps1
          test -f deploy/Test-LocalAI-Candidate.ps1
          test -f docs/INTEGRATIONS.md
          test -f tests/agent-operations-ui.mjs
          test -f tests/integration-hub-ui.mjs
          test -f tests/navigation-ui.mjs
          test -f tests/mobile-ui.mjs
          test -f tests/first-run-ui.mjs
          test -f tests/models-ui.mjs
          test -f tests/images-ui.mjs
          test -f tests/claude-chat-ui.mjs
          test -f tests/agent-orchestrator.test.cjs
          test -f tests/model-runtime.test.cjs
          test -f tests/model-runtime-ui.test.cjs
          test -f tests/model-runtime-server-contract.test.cjs
          test -f tests/run-ledger.test.cjs
          test -f tests/run-execution-server-contract.test.cjs
          test -f tests/run-execution-ui.test.cjs
          test -f tests/run-api.test.cjs

      - name: Prevent private-key files
        run: |
          ! find app -type f \( -name '*.pem' -o -name '*.key' -o -name '*.pfx' -o -name '*.p12' -o -name '.env' \) | grep .

      - name: Validate deployment candidate
        run: pwsh -NoProfile -File deploy/Test-LocalAI-Candidate.ps1 -CandidateRoot . -LocalNode

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser acceptance
        run: |
          mkdir -p /tmp/localai-data
          DATA_DIR=/tmp/localai-data PORT=3080 node app/server.js >/tmp/localai-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          ready=0
          for i in {1..30}; do
            if curl --max-time 2 -fsS http://127.0.0.1:3080/healthz >/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            echo '::error::Local AI server did not become ready for browser acceptance tests.'
            echo '--- server log ---'
            cat /tmp/localai-server.log || true
            exit 1
          fi

          npm run test:browser

      - name: Preserve server diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: localai-server-log
          path: /tmp/localai-server.log
          if-no-files-found: ignore


  storage-compatibility:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22.13.0', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Native SQLite, HTTP and agent regression tests
        run: node --test tests/release.test.cjs tests/storage.test.cjs tests/storage-api.test.cjs tests/agent-orchestrator.test.cjs tests/run-ledger.test.cjs

  deployment-contracts:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Deployment contracts on PowerShell 7
        shell: pwsh
        run: ./tests/Test-LocalAI-DeployContracts.ps1
      - name: Deployment contracts on Windows PowerShell 5.1
        shell: powershell
        run: ./tests/Test-LocalAI-DeployContracts.ps1
