name: windows-contracts

# The deploy, backup and host scripts run on Windows PowerShell 5.1 and 7. Windows runners bill at 2x on a private
# repo, so this runs only for PRs that touch those scripts, plus weekly and on demand.
on:
  pull_request:
    paths:
      - 'deploy/**'
      - 'host/**/*.ps1'
      - 'tests/*.ps1'
      - '.github/workflows/windows-contracts.yml'
  schedule:
    - cron: '23 9 * * 1'
  workflow_dispatch:

concurrency:
  group: windows-contracts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deployment-contracts:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deployment contracts on PowerShell 7
        shell: pwsh
        run: ./tests/Test-LocalAI-DeployContracts.ps1
      - name: Deployment contracts on Windows PowerShell 5.1
        shell: powershell
        run: ./tests/Test-LocalAI-DeployContracts.ps1
      # The real host runner against a real appliance: signed jobs run, tampered and overdue ones don't.
      - name: PowerShell Workbench end to end (Windows PowerShell 5.1)
        shell: powershell
        run: ./tests/Test-LocalAI-PowerShellBridge.ps1
