name: run-retry-lineage-source-patch

on:
  push:
    branches: [feature/unified-run-execution]
    paths:
      - 'scripts/patch-run-retry-lineage.cjs'
      - '.github/workflows/run-retry-lineage-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/unified-run-execution
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply guarded retry lineage fix
        run: node scripts/patch-run-retry-lineage.cjs
      - name: Validate patched JavaScript
        run: |
          node --check app/server.js
          node --check app/public/execution-runtime.js
      - name: Commit patched sources
        run: |
          if git diff --quiet -- app/server.js app/public/execution-runtime.js; then
            echo 'Sources already contain retry lineage integration.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/server.js app/public/execution-runtime.js
          git commit -m 'Preserve execution retry lineage'
          git push origin HEAD:feature/unified-run-execution
