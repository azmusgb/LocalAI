name: unified-run-source-patch

on:
  push:
    branches: [feature/unified-run-execution]
    paths:
      - 'scripts/patch-run-execution.cjs'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/unified-run-execution
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply guarded source patch
        run: node scripts/patch-run-execution.cjs
      - name: Validate patched JavaScript
        run: |
          node --check app/server.js
          node --check app/public/mobile-overhaul.js
      - name: Commit patched sources
        run: |
          if git diff --quiet -- app/server.js app/public/mobile-overhaul.js; then
            echo 'Sources already contain the unified run integration.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/server.js app/public/mobile-overhaul.js
          git commit -m 'Integrate unified execution run lifecycle'
          git push origin HEAD:feature/unified-run-execution
