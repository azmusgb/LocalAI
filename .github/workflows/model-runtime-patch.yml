name: model-runtime-source-patch

on:
  push:
    branches: [feature/model-runtime-truth]
    paths:
      - 'scripts/patch-model-runtime.cjs'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/model-runtime-truth
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply guarded source patch
        run: node scripts/patch-model-runtime.cjs
      - name: Validate patched server syntax
        run: node --check app/server.js
      - name: Commit patched server
        run: |
          if git diff --quiet -- app/server.js; then
            echo 'Server already contains the model-runtime integration.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/server.js
          git commit -m 'Integrate Ollama runtime truth into server'
          git push origin HEAD:feature/model-runtime-truth
